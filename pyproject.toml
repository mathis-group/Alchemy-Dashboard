[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy-dashboard"
version = "0.1.0"
description = "Web dashboard for exploring AlChemy experiment runs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "bokeh==3.6.3",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "werkzeug>=3.0",
    "alchemy @ git+https://github.com/mathis-group/Modern-AlChemy.git@3e72f29588cc4c3e2f25b92270275b0d5cf2b0ff",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.8",
    "Levenshtein>=0.25.0",
    "networkx>=3.4.2",
]
[tool.uv]
package = true

[tool.uv.sources]
alchemy = { git = "https://github.com/mathis-group/Modern-AlChemy.git", rev = "3e72f29588cc4c3e2f25b92270275b0d5cf2b0ff" }

[tool.setuptools.packages.find]
